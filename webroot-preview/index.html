<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twemoji Resurrection — WebUI preview</title>
<style>
  body { margin:0; background:#121216; display:flex; justify-content:center; }
  #frame { width:412px; height:100vh; overflow:hidden; position:relative;
           box-shadow:0 0 0 1px #2a2a32; }
  iframe { width:100%; height:100%; border:0; }
</style>
</head>
<body>
<div id="frame"><iframe src="page.html"></iframe></div>
<script>
// Load the shipped Twemoji font so the preview renders the module's real glyphs
// (desktop browsers would otherwise fall back to the OS emoji font).
const css = document.createElement('style');
css.textContent = `@font-face {
  font-family: 'Noto Color Emoji';
  src: url('../module/system/fonts/NotoColorEmoji.ttf') format('collection');
}`;
document.head.appendChild(css);
</script>
</body>
</html>
